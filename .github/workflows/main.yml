name: Compile MERN to Windows EXE

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:     

jobs:
  build-windows-exe:
    runs-on: windows-latest 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5 

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20' 

    - name: Install Dependencies
      working-directory: ./server 
      run: |
        npm install

    - name: Compile to Standalone EXE
      working-directory: ./server
      run: |
        npm install -g pkg
        pkg . --targets node20-win-x64 --output dist/my-mern-app.exe

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4 
      with:
        name: Windows-Executable
        path: ./server/dist/my-mern-app.exe
